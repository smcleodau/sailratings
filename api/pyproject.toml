[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "irc-data"
version = "0.1.0"
description = "IRC sailing rating data collection & analysis"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40",
    "httpx>=0.25",
    "pandas>=2.1",
    "pdfplumber>=0.10",
    "pydantic>=2.5",
    "click>=8.1",
    "rich>=13.0",
    "psycopg[binary]>=3.1",
    "sqlalchemy>=2.0",
    "beautifulsoup4>=4.12",
    "alembic>=1.13",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "google-genai",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "stripe>=11.0",
    "PyJWT[crypto]>=2.8",
    "resend>=2.0",
    "jinja2>=3.1",
    "posthog>=7.0",
    "firecrawl-py>=4.0",
    "temporalio>=1.5",
    "openhands-sdk>=1.17.0",
    "openhands-tools>=1.37.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "ipython>=8.0",
    "jupyterlab>=4.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.scripts]
irc-data = "irc_data.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "model_regression: SM-01-08 golden fixtures + backtests; run in CI to block model changes that regress report figures",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
